[project]
name = "wikitrends"
version = "0.2.0"
description = "Analyze Wikipedia pageview trends across languages to inform B2C content/localization decisions"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.scripts]
wikitrends = "wikitrends.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
